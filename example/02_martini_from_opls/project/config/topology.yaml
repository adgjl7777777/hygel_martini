# topology.yaml
# Topology stub content written as topol.top.
topology:
  # Main forcefield include (OPLS-AA family).
  forcefield_include: oplsaa.ff/forcefield.itp

  # Water model include (for OPLS + TIP4P setup).
  water_include: oplsaa.ff/tip4p.itp

  # Polymer topology include.
  polymer_itp: polymer.itp

  # [ system ] title.
  system_name: polymer in water

  # Polymer molecule entry in [ molecules ].
  molecule_name: POLYMER
  molecule_count: 1

  # Water molecule entry in [ molecules ].
  # gmx solvate -p will update this SOL count.
  water_molecule_name: SOL
  water_molecule_count: 0
