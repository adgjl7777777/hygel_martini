# hydrogel.yaml
# 한글: 하이드로젤 골격/링커/사이드체인 정의. maker.yaml includes로 병합된다.
# English: Hydrogel backbone/linker/side-chain definitions, merged via maker.yaml.
# ${CONFIG_DIR}는 최상위 maker.yaml의 디렉터리 기준으로 해석된다.
# ${CONFIG_DIR} resolves against the TOP maker.yaml's directory.

monomer_definitions:
  MONOMERS:
    - id: PE          # 모노머 ID / monomer id
      ratio: 1        # 혼합 비율 / mixing ratio
      backbone_id: BB1 # 연결될 backbone id
      gro: ${CONFIG_DIR}/structure/pe.gro
      itp: ${CONFIG_DIR}/structure/pe.itp
    - id: TOL
      ratio: 1
      backbone_id: BB2
      gro: ${CONFIG_DIR}/structure/tol.gro
      itp: ${CONFIG_DIR}/structure/tol.itp
  # 모노머 배열 전략. Monomer sequence strategy along each chain.
  SEQUENCE_STRATEGY:
    strategy: random  # random | block | alternating | long_random

hydrogel_components:
  backbone_definitions:
    # 사슬을 이루는 CG bead 종. ratio는 두 종의 혼합 비율.
    # CG bead species forming the chains; ratio sets their mixing proportion.
    BACKBONES:
      - id: BB1
        ratio: 1
        definition:
          atom_type: C1           # Martini bead type / [atomtypes]에 있어야 함
          residue_name: BCK1      # 출력 topology의 residue 이름 / residue name in output
          atom_name: B1           # bead(atom) 이름 / bead (atom) name
          charge_group_number: 1  # charge group 번호 / charge group index
          mass: 56                # bead 질량 (amu); linker stub도 이 값을 상속 / mass (amu), inherited by stubs
          charge: 0.0             # 전하 (e) / charge (e)
      - id: BB2
        ratio: 1
        definition:
          atom_type: C2
          residue_name: BCK2
          atom_name: B2
          charge_group_number: 1
          mass: 56
          charge: 0.0
    # backbone bead 쌍별 결합. c0 = 평형 길이 (nm), c1 = 힘 상수 (kJ/mol/nm²).
    # Backbone bond per bead pair; c0 = length (nm), c1 = force constant.
    BONDS:
      - between: [BB1, BB1]  # bond 길이/FC는 martini 기반 값
        bond_funct: 1
        bond_c0: 0.47
        bond_c1: 1250
      - between: [BB1, BB2]
        bond_funct: 1
        bond_c0: 0.47
        bond_c1: 1250
      - between: [BB2, BB2]
        bond_funct: 1
        bond_c0: 0.47
        bond_c1: 1250
    # backbone 각도 기본값 (도, kJ/mol/rad²). 180 = 직선 사슬 선호.
    # Default backbone angle (degrees, kJ/mol/rad²); 180 favors straight chains.
    angles:
      default_angle:
        angle_funct: 1
        angle_c0: 180
        angle_c1: 25
    # backbone bead 종의 배열 전략. Sequence strategy for backbone bead species.
    SEQUENCE_STRATEGY:
      strategy: random

  linker_definitions:
    # 한글: linker ITP의 양끝 BCK bead는 실제 linker 내부 bead가 아니라
    #       backbone에 붙을 자리(stub/anchor)를 나타낸다.
    #       backbone_1/backbone_2의 between 값이 각 stub의 target backbone을 정한다.
    #       예: BCK-LNK-LNK-BCK + backbone_1: BB1, backbone_2: BB2
    #           => 의미상 BB1-LNK-LNK-BB2 junction으로 해석된다.
    #       BCK stub 질량은 target backbone YAML mass가 ITP stub mass보다 우선한다.
    #       stub-LNK 내부 bond parameter는 linker ITP의 BCK-LNK 값을 보존한다.
    #       실제 backbone end와 stub 사이의 external dynamic bond는
    #       backbone_1/backbone_2의 target별 entry 및 backbone.yaml patch rule로 결정된다.
    # English: The two BCK beads in linker ITP files are stub/anchor beads, not
    #          ordinary linker-internal beads. backbone_1/backbone_2 assign the
    #          target backbone for each stub. For example,
    #          BCK-LNK-LNK-BCK with backbone_1: BB1 and backbone_2: BB2 is
    #          treated conceptually as a BB1-LNK-LNK-BB2 junction. The BCK stub
    #          mass follows the target backbone YAML mass, overriding the ITP
    #          stub mass. The stub-LNK internal bond keeps the original BCK-LNK
    #          ITP parameter. The external dynamic bond between the real
    #          backbone end and the stub is selected from backbone_1/backbone_2
    #          target-specific entries and can be finalized by backbone.yaml
    #          patch rules.
    LINKERS:
      # 세 링커 종: ratio가 상대 사용 빈도를 정한다.
      # Three linker species; ratio sets their relative frequency.
      - id: SS_linker
        ratio: 1
        gro: ${CONFIG_DIR}/structure/LNK.gro
        itp: ${CONFIG_DIR}/structure/LNK.itp
        linker_residue_name: LNK1   # 링커 내부 bead residue / internal linker residue name
        backbone_residue_name: LB1  # stub bead가 출력에서 받는 residue / stub residue in output
        backbone_1:
          - between: BB1
            bond_funct: 1
            bond_c0: 0.47
            bond_c1: 1250
          - between: BB2
            bond_funct: 1
            bond_c0: 0.47
            bond_c1: 1250
        backbone_2:
          - between: BB1
            bond_funct: 1
            bond_c0: 0.47
            bond_c1: 1250
          - between: BB2
            bond_funct: 1
            bond_c0: 0.47
            bond_c1: 1250
      - id: DD_linker
        ratio: 1
        gro: ${CONFIG_DIR}/structure/LNK2.gro
        itp: ${CONFIG_DIR}/structure/LNK2.itp
        linker_residue_name: LNK2
        backbone_residue_name: LB2
        backbone_1:
          - between: BB1
            bond_funct: 1
            bond_c0: 0.47
            bond_c1: 1250
          - between: BB2
            bond_funct: 1
            bond_c0: 0.47
            bond_c1: 1250
        backbone_2:
          - between: BB1
            bond_funct: 1
            bond_c0: 0.47
            bond_c1: 1250
          - between: BB2
            bond_funct: 1
            bond_c0: 0.47
            bond_c1: 1250
      - id: SD_linker
        ratio: 1
        gro: ${CONFIG_DIR}/structure/LNK3.gro
        itp: ${CONFIG_DIR}/structure/LNK3.itp
        linker_residue_name: LNK3
        backbone_residue_name: LB3
        backbone_1:
          - between: BB1
            bond_funct: 1
            bond_c0: 0.47
            bond_c1: 1250
          - between: BB2
            bond_funct: 1
            bond_c0: 0.47
            bond_c1: 1250
        backbone_2:
          - between: BB1
            bond_funct: 1
            bond_c0: 0.47
            bond_c1: 1250
          - between: BB2
            bond_funct: 1
            bond_c0: 0.47
            bond_c1: 1250
    SEQUENCE_STRATEGY:
      strategy: random
