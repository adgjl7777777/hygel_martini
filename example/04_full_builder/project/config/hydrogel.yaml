# hydrogel.yaml
# 한글: 하이드로젤 골격/링커/사이드체인 정의
# English: Hydrogel backbone/linker/side-chain definitions

monomer_definitions:
  MONOMERS:
    - id: PE          # 모노머 ID / monomer id
      ratio: 1        # 혼합 비율 / mixing ratio
      backbone_id: BB1 # 연결될 backbone id
      gro: ${CONFIG_DIR}/structure/pe.gro
      itp: ${CONFIG_DIR}/structure/pe.itp
    - id: TOL
      ratio: 1
      backbone_id: BB2
      gro: ${CONFIG_DIR}/structure/tol.gro
      itp: ${CONFIG_DIR}/structure/tol.itp
  SEQUENCE_STRATEGY:
    strategy: random  # random | block | alternating | long_random

hydrogel_components:
  backbone_definitions:
    BACKBONES:
      - id: BB1
        ratio: 1
        definition:
          atom_type: C1
          residue_name: BCK1
          atom_name: B1
          charge_group_number: 1
          mass: 56
          charge: 0.0
      - id: BB2
        ratio: 1
        definition:
          atom_type: C2
          residue_name: BCK2
          atom_name: B2
          charge_group_number: 1
          mass: 56
          charge: 0.0
    BONDS:
      - between: [BB1, BB1]  # bond 길이/FC는 martini 기반 값
        bond_funct: 1
        bond_c0: 0.47
        bond_c1: 1250
      - between: [BB1, BB2]
        bond_funct: 1
        bond_c0: 0.47
        bond_c1: 1250
      - between: [BB2, BB2]
        bond_funct: 1
        bond_c0: 0.47
        bond_c1: 1250
    angles:
      default_angle:
        angle_funct: 1
        angle_c0: 180
        angle_c1: 25
    SEQUENCE_STRATEGY:
      strategy: random

  linker_definitions:
    # 한글: linker ITP의 양끝 BCK bead는 실제 linker 내부 bead가 아니라
    #       backbone에 붙을 자리(stub/anchor)를 나타낸다.
    #       backbone_1/backbone_2의 between 값이 각 stub의 target backbone을 정한다.
    #       예: BCK-LNK-LNK-BCK + backbone_1: BB1, backbone_2: BB2
    #           => 의미상 BB1-LNK-LNK-BB2 junction으로 해석된다.
    #       BCK stub 질량은 target backbone YAML mass가 ITP stub mass보다 우선한다.
    #       stub-LNK 내부 bond parameter는 linker ITP의 BCK-LNK 값을 보존한다.
    #       실제 backbone end와 stub 사이의 external dynamic bond는
    #       backbone_1/backbone_2의 target별 entry 및 backbone.yaml patch rule로 결정된다.
    # English: The two BCK beads in linker ITP files are stub/anchor beads, not
    #          ordinary linker-internal beads. backbone_1/backbone_2 assign the
    #          target backbone for each stub. For example,
    #          BCK-LNK-LNK-BCK with backbone_1: BB1 and backbone_2: BB2 is
    #          treated conceptually as a BB1-LNK-LNK-BB2 junction. The BCK stub
    #          mass follows the target backbone YAML mass, overriding the ITP
    #          stub mass. The stub-LNK internal bond keeps the original BCK-LNK
    #          ITP parameter. The external dynamic bond between the real
    #          backbone end and the stub is selected from backbone_1/backbone_2
    #          target-specific entries and can be finalized by backbone.yaml
    #          patch rules.
    LINKERS:
      - id: SS_linker
        ratio: 1
        gro: ${CONFIG_DIR}/structure/LNK.gro
        itp: ${CONFIG_DIR}/structure/LNK.itp
        linker_residue_name: LNK1
        backbone_residue_name: LB1
        backbone_1:
          - between: BB1
            bond_funct: 1
            bond_c0: 0.47
            bond_c1: 1250
          - between: BB2
            bond_funct: 1
            bond_c0: 0.47
            bond_c1: 1250
        backbone_2:
          - between: BB1
            bond_funct: 1
            bond_c0: 0.47
            bond_c1: 1250
          - between: BB2
            bond_funct: 1
            bond_c0: 0.47
            bond_c1: 1250
      - id: DD_linker
        ratio: 1
        gro: ${CONFIG_DIR}/structure/LNK2.gro
        itp: ${CONFIG_DIR}/structure/LNK2.itp
        linker_residue_name: LNK2
        backbone_residue_name: LB2
        backbone_1:
          - between: BB1
            bond_funct: 1
            bond_c0: 0.47
            bond_c1: 1250
          - between: BB2
            bond_funct: 1
            bond_c0: 0.47
            bond_c1: 1250
        backbone_2:
          - between: BB1
            bond_funct: 1
            bond_c0: 0.47
            bond_c1: 1250
          - between: BB2
            bond_funct: 1
            bond_c0: 0.47
            bond_c1: 1250
      - id: SD_linker
        ratio: 1
        gro: ${CONFIG_DIR}/structure/LNK3.gro
        itp: ${CONFIG_DIR}/structure/LNK3.itp
        linker_residue_name: LNK3
        backbone_residue_name: LB3
        backbone_1:
          - between: BB1
            bond_funct: 1
            bond_c0: 0.47
            bond_c1: 1250
          - between: BB2
            bond_funct: 1
            bond_c0: 0.47
            bond_c1: 1250
        backbone_2:
          - between: BB1
            bond_funct: 1
            bond_c0: 0.47
            bond_c1: 1250
          - between: BB2
            bond_funct: 1
            bond_c0: 0.47
            bond_c1: 1250
    SEQUENCE_STRATEGY:
      strategy: random
