# backbone.yaml
# English-only patch rules for the legacy real_test chemistry.
# These rules update the generated hydrogel topology after the backbone and
# side-chain structures have been instantiated.
# 한글: linker BCK stub의 target backbone은 hydrogel.yaml의 backbone_1/backbone_2가 정한다.
#       이 파일은 생성된 topology의 residue/type pattern을 보고 최종 bonded parameter를
#       patch한다. 특히 실제 backbone end와 linker stub 사이의 external junction bond를
#       BB1/BB2 chemistry에 맞추는 용도이다. stub-LNK 내부 bond는 linker ITP에서 온
#       내부 bond이므로, 여기에 해당 residue/type rule을 추가하지 않으면 원본 ITP 값을 유지한다.
# English: The target backbone of a linker BCK stub is assigned by
#          hydrogel.yaml backbone_1/backbone_2. This file patches final bonded
#          parameters by matching residue/type patterns in the generated
#          topology. It is especially useful for external junction bonds between
#          real backbone ends and linker stubs. A stub-LNK internal bond comes
#          from the linker ITP and keeps the original ITP parameter unless a
#          matching residue/type rule is added here.

# 각 규칙: residue_name/bead_type 패턴이 (와일드카드 "*" 허용) 일치하는 결합의
# funct/c0/c1을 덮어쓴다. c0 = 평형 길이 (nm), c1 = 힘 상수 (kJ/mol/nm²).
# Each rule overwrites funct/c0/c1 of bonds whose residue_name/bead_type
# pattern matches ("*" is a wildcard); c0 in nm, c1 in kJ/mol/nm².
bonds:
  # backbone-backbone 결합 / backbone-backbone bonds
  - residue_name: [BCK1, BCK1]
    bead_type: [C1, C1]
    funct: 1
    c0: 0.47
    c1: 1250
  - residue_name: [BCK1, BCK2]
    bead_type: [C1, C2]
    funct: 1
    c0: 0.47
    c1: 1250
  - residue_name: [BCK2, BCK2]
    bead_type: [C2, C2]
    funct: 1
    c0: 0.47
    c1: 1250
  # linker stub(LB*)과 backbone end 사이 external junction bond.
  # External junction bonds between linker stubs (LB*) and backbone ends.
  - residue_name: [LB1, BCK1]
    bead_type: ["*", C1]
    funct: 1
    c0: 0.47
    c1: 1250
  - residue_name: [LB1, BCK2]
    bead_type: ["*", C2]
    funct: 1
    c0: 0.47
    c1: 1250
  - residue_name: [LB2, BCK1]
    bead_type: ["*", C1]
    funct: 1
    c0: 0.47
    c1: 1250
  - residue_name: [LB2, BCK2]
    bead_type: ["*", C2]
    funct: 1
    c0: 0.47
    c1: 1250
  - residue_name: [LB3, BCK1]
    bead_type: ["*", C1]
    funct: 1
    c0: 0.47
    c1: 1250
  - residue_name: [LB3, BCK2]
    bead_type: ["*", C2]
    funct: 1
    c0: 0.47
    c1: 1250
