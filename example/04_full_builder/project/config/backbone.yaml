    c0: 0.47
    c1: 1250
  - residue_name: [LB1, BCK2]
    bead_type: ["*", C2]
    funct: 1
    c0: 0.47
    c1: 1250
  - residue_name: [LB2, BCK1]
    bead_type: ["*", C1]
    funct: 1
