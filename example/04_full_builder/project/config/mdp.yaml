# mdp.yaml
# 한글: geo-opt 및 EM 기본 MDP 값. maker.yaml includes로 병합된다.
# English: Base MDP parameters for geo optimization/minimization,
#          merged via maker.yaml's includes list.

simulation_parameters:
  geo_opt:
    # EM 작업 디렉터리 이름에 붙는 접미사. Suffix appended to the EM work directory name.
    output_dir_suffix: _geo_opt
    # GROMACS deffnm(출력 파일 공통 접두어). Common prefix for GROMACS outputs (-deffnm).
    deffnm_prefix: em
    # 아래 키들은 생성되는 minim.mdp의 기본값을 덮어쓴다.
    # Keys below override the generated minim.mdp defaults.
    mdp:
      # steep = steepest descent 에너지 최소화. Steepest-descent minimization.
      integrator: steep
      # 최대 EM 스텝 수. Maximum number of EM steps.
      nsteps: 5000
      # 수렴 판정 최대 힘 (kJ/mol/nm). Convergence force threshold (kJ/mol/nm).
      emtol: 1000.0
      # 초기 스텝 크기 (nm). Initial minimization step size (nm).
      emstep: 0.01
      # 정전기 처리 방법. Electrostatics method.
      coulombtype: PME
      # Coulomb cutoff (nm).
      rcoulomb: 1.5
      # 반데르발스 처리 방식. Van der Waals treatment.
      vdw_type: cutoff
      # VdW cutoff (nm).
      rvdw: 1.5
