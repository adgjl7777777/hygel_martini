# maker_soft_md.yaml — soft_em 수렴 후 이어 도는 짧은 NPT MD(soft_md) 진입 설정.
# Entry config for the short settling NPT MD (soft_md) after soft_em converges.
#
# includes는 순서대로 deep-merge되고 이 파일이 마지막에 덮어쓴다. 값 안의
# ${CONFIG_DIR}는 include된 파일이 아니라 이 maker 파일의 디렉터리 기준이다.
# Includes are deep-merged in order, this file overriding last. ${CONFIG_DIR}
# in values resolves against THIS maker file's directory, not the included file's.
includes:
  - config/common.yaml    # 공용 도구/자원/입력 경로 / shared tools, resources, inputs
  - config/soft_md.yaml   # soft_md 단계 설정 / the soft_md stage settings
