tools:
  # GROMACS executable used by both soft_em and soft_md.
  gmx: gmx_mpi

runtime:
  # Keep the default conservative for shared NAS runs.
  # omp_threads: rank당 OpenMP 스레드 수 (= -ntomp = OMP_NUM_THREADS)
  # MPI 사용 시 총 코어 = omp_threads × mpi_np
  omp_threads: 1
  # GPU control: null=CPU-only, N=pin to GPU N (CUDA_VISIBLE_DEVICES=N).
  gpu_id: null
  # mpi_np: null → mpirun 없음 (단일 프로세스). N으로 설정하면 mdrun만 mpirun으로 실행.
  # mpi_args: 추가 mpirun 옵션 (예: ["--bind-to", "none"])
  # 예) 8-GPU 멀티노드: omp_threads=6, gpu_id="01234567", mpi_np=8
  mpi_np: null
  mpi_args: []
  # Optional arguments appended to every mdrun command. Periodically winding
  # networks may require an audited bonded cutoff, e.g. ["-rdd", "1.0"].
  mdrun_args: []

paths:
  # Default upstream builder output. Change these if you want to use
  # 04_full_builder or another built system instead of 04_1_example_system.
  system_top: ${CONFIG_DIR}/../../../04_1_example_system/project/output/system.top
  bonded_itp: ${CONFIG_DIR}/../../../04_1_example_system/project/output/initial_hydrogel.itp
