# 스키마 버전 (로더 호환성 표시). Schema version tag for the loader.
schema_version: 1
# template: true는 로더가 실행을 거부한다 — 실제 사용 시 false/삭제.
# template: true is refused at load; set false / remove it for a real run.
template: true

# analysis_jobs.yaml의 property별 입력 gate.
# 절대 경로 대신 analysis_jobs inputs의 key/basename도 사용할 수 있습니다.
# English: per-property MD-requirement gate (property_extract.requirements).
# A property missing from this mapping can never pass the gate. Per entry:
#   md_required:      production MD 산출물이 전제인지 / whether MD output is a prerequisite
#   validation_role:  결과 해석 역할 표시, PropertyResult로 전파 / interpretation
#                     role propagated into the PropertyResult
#   required_inputs:  분석 전 존재해야 하는 정적 입력 (analysis_jobs inputs의
#                     key 또는 basename으로 매칭) / static inputs that must
#                     exist, matched by key or basename
#   required_outputs: 존재해야 하는 MD 산출물 (glob 허용) / MD artifacts that
#                     must exist (globs allowed)
#   required_columns: 발견된 .xvg 안에서 검증할 컬럼 / columns verified inside
#                     every found .xvg
#   required_md_jobs: 선언적 선행 MD job id — 직접 실행 확인은 하지 않고
#                     산출물 부재로 보고 / declarative job ids, reported
#                     missing via absent outputs rather than probed
#   notes:            claim boundary 메모 / free-text claim-boundary note
property_requirements:
  reduced_network_topology_audit:
    md_required: false
    validation_role: structural_audit
    required_inputs: [itp, gro]
    required_outputs: []
    required_columns: []
    required_md_jobs: []
    notes: bonded graph와 periodic winding 검증; force-field 검증이 아님

  loading_qm:
    md_required: false
    validation_role: composition_check_only
    required_inputs: [top, itp]
    required_outputs: []
    required_columns: []
    required_md_jobs: []
    notes: imposed composition이며 equilibrium free swelling이 아님

  local_clearance_diameter_p50_nm:
    md_required: false
    validation_role: proxy
    required_inputs: [gro]
    required_outputs: []
    required_columns: []
    required_md_jobs: []
    notes: local-clearance proxy이며 unique pore 또는 experimental mesh가 아님

  paired_step_finite_rate_apparent_shear_response:
    md_required: true
    validation_role: finite_rate
    required_inputs: [baseline_xvg, positive_xvg, negative_xvg]
    required_outputs: []
    required_columns: [Pres-XY]
    required_md_jobs: [paired_step_baseline_positive_negative]
    notes: registered finite-rate response; equilibrium/experimental modulus가 아님

  polymer_volume_fraction:
    md_required: true
    validation_role: direct
    required_inputs: [top, itp, energy_xvg]
    required_outputs: []
    required_columns: [Volume]
    required_md_jobs: [swollen_npt_equilibration]
    notes: box-volume 기반 imposed-state polymer fraction
