# Partial conversion variant: each strand forms with probability 0.5, so the
# mean realized junction degree is 3 of 6 and half the arms stay unreacted.
#
# Fragmentation is physics here, not a construction defect -- below the bond
# percolation threshold the network is SUPPOSED to be pieces -- so the
# connectivity audit reports instead of gating. "One polymer" statements for
# partially converted systems live in the reduced junction-strand graph
# (property_extract.cyclic_topology after reduce_to_junctions), not in a
# circuit or component count.
includes:
  - config/simulation.yaml
  - config/mdp.yaml
  - config/hydrogel.yaml
  - config/network.yaml

simulation_parameters:
  # 완전 전환 빌드의 output/과 분리해 둔다. Kept separate from the full build's output/.
  output_dir: ${CONFIG_DIR}/output_partial
  network_layout:
    # rewiring 후 strand별 독립 형성 확률 (strand dilution 모델).
    # Per-strand independent formation probability, applied after rewiring.
    conversion:
      fraction: 0.5
      # 필수: 시드 없는 선택은 실행마다 달라진다.
      # Required: unseeded selection differs on every run.
      seed: 3

# simulation.yaml의 gate 설정을 보고 전용으로 덮어쓴다 (임계값 사실상 해제).
# Overrides simulation.yaml's gating audit to report-only (thresholds disarmed).
hydrogel_topology_connectivity_audit:
  enabled: true
  min_largest_component_fraction: 0.0
  max_components: 100000
  fail_on_violation: false
