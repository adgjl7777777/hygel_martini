# f=6 hexafunctional network on the primitive-cubic (pcu) net.
#
# Self-contained: no cross-project includes. ${CONFIG_DIR} resolves against
# THIS maker.yaml's directory for every included file, so including another
# example's config re-points its relative paths into this project.
includes:
  - config/simulation.yaml
  - config/mdp.yaml
  - config/hydrogel.yaml
  - config/network.yaml
