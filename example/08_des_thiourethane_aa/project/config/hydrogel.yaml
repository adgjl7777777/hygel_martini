# One strand chemistry, one junction chemistry -- the experimental pair.
# Included from maker.yaml; ${CONFIG_DIR} resolves against the TOP maker.yaml's
# directory, not this file's.
monomer_definitions:
  # No per-monomer side chains: the strand arrives as one whole molecule below.
  MONOMERS: []
  SEQUENCE_STRATEGY:
    strategy: random

hydrogel_components:
  backbone_definitions:
    BACKBONES:
      # Whole-strand template: TDI-PPG(n=3)-TDI with both thiourethane
      # carbonyl carbons exposed as attachment atoms BCK1/BCK2.
      - id: STR1
        ratio: 1
        # 'template' (instead of 'definition') selects whole-strand mode: the
        # molecule is placed rigidly and everything in the ITP survives into
        # the combined topology. The net layout accepts exactly one such entry.
        template:
          gro: ${CONFIG_DIR}/structure/STR.gro
          itp: ${CONFIG_DIR}/structure/STR.itp
    SEQUENCE_STRATEGY:
      strategy: random

  linker_definitions:
    # UNREACTED Hexakis junction: six sulfurs (residue BCK) are the stubs and
    # keep their thiol hydrogens as per-stub cap atoms. When an arm reacts the
    # builder deletes its cap H and applies the reacted override (type lkS,
    # charge = qS + qH, exactly neutral); an unreacted arm keeps real S-H --
    # which is what the Cl- coordination questions (S-H vs N-H) require.
    # The stubs/stub_caps block below is generated by
    # ../parameterization/build_templates.py (structure/hydrogel_stubs_snippet.yaml)
    # because the atom names differ per arm. The builder bond S-C(=O) carries
    # the LNK thiourethane values inline.
    LINKERS:
      - id: HEXR_junction
        ratio: 1
        gro: ${CONFIG_DIR}/structure/HEXU.gro
        itp: ${CONFIG_DIR}/structure/HEXU.itp
        # Residue name of the junction's non-stub atoms in the output topology.
        linker_residue_name: HEX
        # Residue name the stub atoms report as their bonded-partner residue.
        backbone_residue_name: STR
        # One entry per stub: admissible target strand plus the external
        # crosslink bond (c0 nm, c1 kJ/mol/nm^2). With a whole-strand target
        # the stub sulfurs keep their ITP mass (no Martini mass override).
        stubs:
          - [{between: STR1, bond_funct: 1, bond_c0: 0.1715, bond_c1: 187443.2}]
          - [{between: STR1, bond_funct: 1, bond_c0: 0.1715, bond_c1: 187443.2}]
          - [{between: STR1, bond_funct: 1, bond_c0: 0.1715, bond_c1: 187443.2}]
          - [{between: STR1, bond_funct: 1, bond_c0: 0.1715, bond_c1: 187443.2}]
          - [{between: STR1, bond_funct: 1, bond_c0: 0.1715, bond_c1: 187443.2}]
          - [{between: STR1, bond_funct: 1, bond_c0: 0.1715, bond_c1: 187443.2}]
        stub_caps:
          - {cap_atoms: [H1C], reacted: {S00: {charge: -0.274892, type: lkS}}}
          - {cap_atoms: [H1Q], reacted: {S0E: {charge: -0.269698, type: lkS}}}
          - {cap_atoms: [H1X], reacted: {S0M: {charge: -0.270298, type: lkS}}}
          - {cap_atoms: [H28], reacted: {S0X: {charge: -0.263698, type: lkS}}}
          - {cap_atoms: [H2F], reacted: {S14: {charge: -0.271998, type: lkS}}}
          - {cap_atoms: [H2N], reacted: {S1B: {charge: -0.271698, type: lkS}}}
    SEQUENCE_STRATEGY:
      strategy: random
