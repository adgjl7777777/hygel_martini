# maker_shrink_des.yaml — guarded shrink of the DES SYSTEM (network + 384
# AcCh(+)Cl(-) pairs) from its construction box to a dense state.
#
# Network and solvent are compressed together, which is why the DES is
# inserted before this stage and not after: at 1 g/cm3 there is no room left
# to add it.
#
# 한글: 건설 밀도(희박)에서 실제 밀도로 줄이는 단계. 건설 상자는 놓아야 할
#   기하가 정하고, 최종 상자는 여기서 target_box_nm이 정한다.
# English: the construction box is set by the geometry that has to be placed;
#   the final box is set here. This is the stage that coils the extended
#   strands, and it is a demonstration of the path, not a physical claim about
#   the n = 3 model (whose strands are shorter than the experimental ones).
#
# Target: 7.19 nm cubic. Network 153.9 kamu + 384 x (146.21 + 35.45) amu of
# DES = 223.7 kamu, which 7.188^3 nm^3 puts at ~1.0 g/cm3. The dry network
# alone targets 6.34 nm (maker_shrink.yaml); the DES adds mass, so the dense
# box is larger.
includes:
  - ../../05_hydrogel_relaxation/project/config/common.yaml
  - ../../05_hydrogel_relaxation/project/config/hard_em_shrink.yaml

runtime:
  omp_threads: 4

paths:
  start_gro: ${CONFIG_DIR}/output_des/final_system.gro
  system_top: ${CONFIG_DIR}/output_des/final_system_no_ions_geo_opt/system.top
  bonded_itp: ${CONFIG_DIR}/output_des/initial_hydrogel.itp
  workdir: ${CONFIG_DIR}/shrink_output_des

hard_em_shrink:
  minim_mdp: ${CONFIG_DIR}/config_shrink/minim.mdp
  nvt_recovery_mdp: ${CONFIG_DIR}/config_shrink/nvt_recovery.mdp
  target_box_nm: 7.19
  shrink_fraction: 0.02
  max_steps: 300
