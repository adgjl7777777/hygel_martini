# Experimental stoichiometry: Hexakis-SH : PPG-TDI = 1 : 0.5 (molar), i.e.
# one NCO per six SH -- SH conversion 1/6. Flory-Stockmayer for A6+B2 gels at
# p*(f-1) = 1, i.e. p = 0.2 > 1/6: at the experimental ratio the covalent
# system alone is BELOW the gel point, so fragments are the correct outcome
# here (the real material's integrity comes from the DES hydrogen-bond
# network on top). The connectivity audit therefore reports, not gates.
#
# Chemically faithful partial conversion: the junction template is the
# UNREACTED form and each arm's thiol hydrogen is a per-stub cap atom
# (stub_caps in config/hydrogel.yaml). An unreacted arm keeps real S-H with
# thiol charges/types; a reacted arm loses its hydrogen and takes the
# thiourethane sulfur override -- which is exactly what the collaboration's
# Q1 comparison (Cl- at S-H vs N-H sites) requires of the model.
# Deep-merged in order; later files override earlier ones, this file overrides
# all. ${CONFIG_DIR} in every included file resolves against THIS directory.
includes:
  - config/simulation.yaml   # runtime, GROMACS, all-atom mode, crosslinking
  - config/mdp.yaml          # EM MDP parameters
  - config/hydrogel.yaml     # strand template and junction chemistry
  - config/network.yaml      # pcu net layout (no rewiring)

simulation_parameters:
  # Kept separate from the full build's output/.
  output_dir: ${CONFIG_DIR}/output_partial
  network_layout:
    # Strand dilution: each strand forms independently with this probability
    # (1/6 = the experimental SH conversion). Unformed strands are removed.
    conversion:
      fraction: 0.166667
      # Required: unseeded selection differs on every run.
      seed: 3

# Overrides simulation.yaml's gating audit to report-only (thresholds
# disarmed): below the gel point, fragmentation is the expected outcome.
hydrogel_topology_connectivity_audit:
  enabled: true
  min_largest_component_fraction: 0.0
  max_components: 100000
  fail_on_violation: false
