paths:
  # Base directory for all relative paths below.
  # `${CONFIG_DIR}` is the directory that contains this file.
  base_dir: ${CONFIG_DIR}/..
  out_root: ${CONFIG_DIR}/../geo_opt_S
system:
  # Explicit polymer sequences to build.
  # When this is set, the older symbols/lengths expansion is not used.
  sequences:
    - S

# Monomer library for sequence tokens.
# Each token entry supports:
# - `xyz`: source xyz used to build the polymer geometry
# - `init_template`: Bartender-style monomer template used to assemble the final inp
# - `charge`: integer charge contribution of one monomer unit
# - `multiplicity` or `uhf`: spin state for one monomer unit
# - `backbone_atoms`: optional 0-based atom indices used for both
#   connector head/tail inference and backbone bead detection
monomers:
  S:
    xyz: NEW_SBMA.xyz
    init_template: NEW_SBMA_init.inp
    charge: 0
    multiplicity: 1
    # backbone_atoms:
    #   head: [0]
    #   tail: [1]
    #   body: []
  D:
    xyz: NEW_DMAPS.xyz
    init_template: NEW_DMAPS_init.inp
    charge: 0
    multiplicity: 1
  C:
    xyz: NEW_CBA.xyz
    init_template: NEW_CBA_init.inp
    charge: 0
    multiplicity: 1

bartender_pipeline:
  # Geometry preparation stage before Bartender.
  # - `xtb`: xTB geometry optimization
  # - `orca`: ORCA geometry optimization
  # - `off`: skip geometry optimization and use the built polymer xyz directly
  relaxation: xtb

  # Sampling source that Bartender should use.
  # - `bartender`: Bartender runs its own internal xTB sampling
  # - `xtb`: this pipeline runs xTB MD first and Bartender consumes that
  #   trajectory through `-owntraj/-refit`
  # - `existing`: skip xTB MD generation here and let Bartender consume
  #   an already existing trajectory from `md_traj`
  # - `xtb_nobartender`: run xTB MD here but stop before Bartender
  # - `off`: stop after the geometry stage above; do not create MD/Bartender jobs
  md: xtb_nobartender

  # External trajectory path used only when `md: existing`.
  # Relative paths are resolved under `paths.base_dir`.
  md_traj: ""

  # Name of the per-case directory that stores the geometry or pre-MD stage.
  # If `md: off` or `md: xtb_nobartender`, this is the final work directory for that case.
  workdir_name: relax_xtb_geoopt

  # Marker atom used to detect polymer connection beads from the monomer xyz.
  # Change this if the chemistry uses a connector other than Br.
  connection_indicator: Br

  # Distance cutoff used when matching the connector marker above to the
  # monomer backbone_atoms.head / backbone_atoms.tail reference atoms.
  connection_cutoff: 2.2

  term_generation:
    # Supported now:
    # - `init_only`: keep only the init-template terms
    # - `all_unique`: add all unique reversible combinations
    # - `topology_n`: keep only graph-topology-consistent terms whose
    #   topology cost is <= n
    # - `topology_swap_n`: topology_n plus permutation/swap allowance
    # - `polymer_backbone`: add all unique reversible combinations, then keep
    #   only new terms involving at least two distinct backbone beads
    # For real polymer cases, switch this to `polymer_backbone`.
    mode: all_unique

    # Budget used by `topology_n` / `topology_swap_n`.
    n: 0

  execution:
    # If true, run the generated relaxation shell script immediately.
    run_relaxation: true

    # If true, run the generated Bartender shell script immediately.
    run_bartender: true

    # Shell used for immediate execution.
    shell: bash

  logs:
    # If true, collect validation/runtime logs under one folder.
    enabled: true

    # Per-case log directory name.
    dirname: logs

    # If true, write validation reports into the log directory.
    write_validation: true

    # If true, write stdout/stderr from immediate execution into the log directory.
    capture_runtime: true

  electronic_state:
    # If null, the total case charge is inferred by summing monomer charges.
    charge: null
    # If null, the total case spin is inferred by summing monomer spins.
    # When one of `uhf` / `multiplicity` is set, the other is derived.
    uhf: null
    multiplicity: null

  xtb:
    # Shell snippet sourced before xTB runs. Keep this if xTB needs env vars.
    env_script: /opt/xtb-dist/share/xtb/config_env.bash

    # xTB executable path.
    binary: /opt/xtb-dist/bin/xtb

    # Semiempirical model passed as `--gfn`.
    gfn: 2

    # CPU count passed to `--parallel`.
    parallel: 1

    # Geometry optimization level used when `relaxation: xtb`.
    opt_level: normal

    # Maximum xTB geometry optimization cycles.
    opt_cycles: 10000

    # xTB numerical accuracy (`--acc`).
    acc: 1.0

    # Electronic temperature (`--etemp`).
    etemp: 300.0

    # Solvation model for xTB.
    # Allowed values are `off`, `alpb`, `gbsa`.
    solvent_model: alpb

    # Solvent name passed to xTB together with the solvent model.
    solvent: water

    # Optional extra solvent reference argument for xTB. Usually keep empty.
    solvent_reference: ""

    # If non-empty, this file fully overrides the auto-generated xTB MD input.
    # In other words, the file contents become `gochem.inp`.
    md_input_template_path: ""

    md:
      # Target temperature for xTB MD.
      temp_k: 310.0

      # MD length in ps for the xTB pre-Bartender trajectory.
      time_ps: 5000

      # Trajectory dump interval in fs.
      dump_fs: 50.0

      # Integration step in fs.
      step_fs: 4.0

      # Whether xTB should generate velocities internally.
      velo: false

      # Hydrogen mass scaling for xTB MD.
      hmass: 4

      # SHAKE level for xTB MD.
      shake: 2

      # SCC convergence setting inside xTB MD.
      sccacc: 2.0

      # Restart xTB MD from restart information if available.
      restart: false

  orca:
    # ORCA executable path.
    binary: /opt/orca/orca

    # CPU count for ORCA.
    nprocs: 1

    # Default ORCA method line used only when no template file is supplied.
    method_line: r2scan-3c CPCM(water) Opt TightSCF

    # Default ORCA geometry iteration cap used only when no template file is supplied.
    max_iter: 300

    # If non-empty, this file overrides the auto-generated ORCA header/body.
    # The pipeline still appends the final `* xyzfile charge multiplicity xyz`.
    input_template_path: orca_loose.inp

  bartender:
    # Root directory exported as `BTROOT` before Bartender runs.
    root: /opt/bartender-1.1.0

    # Shell snippet sourced before Bartender runs.
    env_script: /opt/bartender-1.1.0/bartender_config.sh

    # Bartender executable path.
    binary: /opt/bartender-1.1.0/bartender

    # CPU count passed to Bartender `-cpus`.
    cpus: 1

    # If null, Bartender charge defaults to the resolved case charge above.
    charge: null

    # Internal Bartender-xTB sampling time in ps.
    # Used only when `md: bartender`.
    time_ps: 5000

    # Internal Bartender-xTB temperature in K.
    # Used only when `md: bartender`.
    temperature_k: 310.0

    # Bartender solvent keyword for the internal path.
    # Used only when `md: bartender`.
    solvent: h2o

    # Optional DCD output filename from Bartender internal sampling.
    # Used only when `md: bartender`.
    dcd_save: ""

    # Frame skipping factor for Bartender input trajectory handling.
    skip: 1

    # Name of the per-case Bartender job directory.
    output_dirname: bartender_job

  # Postprocess is intentionally split out of this file.
  # Run it later with:
  #   bash hygel_run.sh --postprocess-only
  # or
  #   bash hygel_run.sh config_common/postprocess.yaml --postprocess-only
