# config/backbone.yaml
# Special markers:
# '-' : Skip bead in angle/dihedral definition but use for connectivity.
# '*' : Wildcard for any residue name (must not be a backbone bead).

# --- Bonds Definition ---
# These rules will be applied to update bond parameters (c0, c1).
# Connectivity is determined by the builder logic.
# 한글: linker의 BCK stub target은 hydrogel.yaml의 backbone_1/backbone_2에서 먼저 정해진다.
#       이 파일의 bonds rule은 생성된 topology에서 residue/type이 맞는 결합의
#       최종 c0/c1을 patch한다. 주로 실제 backbone end와 linker stub 사이의
#       external junction bond를 target chemistry에 맞추는 데 사용한다.
#       stub과 linker 내부 bead 사이의 BCK-LNK bond는 linker ITP의 내부 bond이며,
#       여기에 별도 rule을 쓰지 않는 한 원본 ITP parameter를 유지한다.
# English: Linker BCK stub targets are assigned first by hydrogel.yaml
#          backbone_1/backbone_2. The bond rules below patch final c0/c1 values
#          for generated topology bonds whose residue/type pattern matches.
#          They are mainly used to finalize external junction bonds between a
#          real backbone end and a linker stub. The BCK-LNK bond between a stub
#          and an internal linker bead is a linker-ITP internal bond and keeps
#          the original ITP parameter unless an explicit rule here matches it.
# 각 규칙: residue_name/bead_type 패턴이 일치하는 결합의 funct/c0/c1을
# 덮어쓴다. c0 = 평형 길이 (nm), c1 = 힘 상수 (kJ/mol/nm²).
# Each rule overwrites funct/c0/c1 of matching bonds; c0 in nm, c1 in kJ/mol/nm².
bonds:
  # Backbone-Backbone Bonds
  - residue_name: [BS, BS]
    bead_type: [SC1, SC1]
    funct: 1
    c0: 0.281
    c1: 15000
  - residue_name: [BS, BD]
    bead_type: [SC1, TC1]
    funct: 1
    c0: 0.266
    c1: 16876.12
  - residue_name: [BD, BD]
    bead_type: [TC1, TC1]
    funct: 1
    c0: 0.252
    c1: 18752.24
  
  # Linker LDD Bonds (LBDDA=LinkerStart, LBDDB=LinkerEnd)
  # Assuming backbone_residue_name: [LBDDA, LBDDB]
  # Linker Side 1 (LBDDA)
  - residue_name: [LBDDA, BD]
    bead_type: ["*", TC1]
    funct: 1
    c0: 0.252
    c1: 18752.24
  - residue_name: [LBDDA, BS]
    bead_type: ["*", SC1]
    funct: 1
    c0: 0.266
    c1: 16876.12
  # Linker Side 2 (LBDDB)
  - residue_name: [LBDDB, BD]
    bead_type: ["*", TC1]
    funct: 1
    c0: 0.252
    c1: 18752.24
  - residue_name: [LBDDB, BS]
    bead_type: ["*", SC1]
    funct: 1
    c0: 0.266
    c1: 16876.12

  # Linker LSS Bonds (LBSSA, LBSSB)
  - residue_name: [LBSSA, BD]
    bead_type: ["*", TC1]
    funct: 1
    c0: 0.266
    c1: 16876.12
  - residue_name: [LBSSA, BS]
    bead_type: ["*", SC1]
    funct: 1
    c0: 0.281
    c1: 15000
  - residue_name: [LBSSB, BD]
    bead_type: ["*", TC1]
    funct: 1
    c0: 0.266
    c1: 16876.12
  - residue_name: [LBSSB, BS]
    bead_type: ["*", SC1]
    funct: 1
    c0: 0.281
    c1: 15000

  # Linker LDS Bonds (LBDSA, LBDSB)
  - residue_name: [LBDSA, BD]
    bead_type: ["*", TC1]
    funct: 1
    c0: 0.252
    c1: 18752.24
  - residue_name: [LBDSA, BS]
    bead_type: ["*", SC1]
    funct: 1
    c0: 0.266
    c1: 16876.12
  - residue_name: [LBDSB, BD]
    bead_type: ["*", TC1]
    funct: 1
    c0: 0.266
    c1: 16876.12
  - residue_name: [LBDSB, BS]
    bead_type: ["*", SC1]
    funct: 1
    c0: 0.281
    c1: 15000

# 각도 patch 규칙. c0 = 평형 각도 (도), c1 = 힘 상수 (kJ/mol/rad²).
# funct 2 = Gromos96 harmonic cosine. '-' 항목은 연결성으로만 세고 각도 정의에서
# 건너뛰는 자리 표시자 (파일 상단 Special markers 참조).
# Angle patch rules; c0 in degrees, c1 in kJ/mol/rad². funct 2 = G96 cosine.
# '-' skips a bead in the angle definition while keeping connectivity.
angles:
  - residue_name: [BD, BD, "*"]
    bead_type: [TC1, TC1, SP3d]
    funct: 2
    c0: 180.0
    c1: 25.0
  - residue_name: [BD, BD, "-", "-", "*"]
    bead_type: [TC1, TC1, "-", "-", SQ2]
    funct: 2
    c0: 120.0
    c1: 50.0

# 이면각 patch 규칙. funct 1 = proper periodic; c0 = 위상 (도),
# c1 = 힘 상수 (kJ/mol), multiplicity = 주기성 n.
# Dihedral patch rules; funct 1 = proper periodic: c0 phase (degrees),
# c1 force constant (kJ/mol), multiplicity = periodicity n.
dihedrals:
  - residue_name: [BD, BD, BD, BD]
    bead_type: [TC1, TC1, TC1, TC1]
    funct: 1
    c0: 180.0
    c1: 10.0
    multiplicity: 1
