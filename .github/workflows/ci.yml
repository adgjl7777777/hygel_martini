name: Python package checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build source and wheel distributions
        run: python -m build

      - name: Inspect distributions
        run: python -m twine check dist/*

      - name: Test the installed wheel outside the source checkout
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/hygel-wheel-env"
          "$RUNNER_TEMP/hygel-wheel-env/bin/python" -m pip install dist/*.whl pytest
          mkdir "$RUNNER_TEMP/hygel-wheel-tests"
          cp -r tests "$RUNNER_TEMP/hygel-wheel-tests/"
          cd "$RUNNER_TEMP/hygel-wheel-tests"
          unset PYTHONPATH
          export OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1
          "$RUNNER_TEMP/hygel-wheel-env/bin/python" -c 'import hygel_martini; assert "site-packages" in hygel_martini.__file__; print(hygel_martini.__file__)'
          "$RUNNER_TEMP/hygel-wheel-env/bin/python" -m pytest -q tests
